<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 / 注册 - 预测市场</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card card">
    <h2 class="text-center mb-4">预测市场平台</h2>
    <div class="tab-row mb-4">
      <button id="tab-login" class="tab-btn active" onclick="switchAuth('login')">登录</button>
      <button id="tab-reg" class="tab-btn" onclick="switchAuth('register')">注册新账号</button>
    </div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" class="form-input" placeholder="3~20位中文/字母/数字/下划线">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" class="form-input" placeholder="至少6位密码">
    </div>
    <button id="submit-btn" class="btn btn-primary btn-block" onclick="submitAuth()">立即登录</button>
    <p class="text-sm text-muted text-center mt-3">可由环境变量 ADMIN_USERNAMES / ADMIN_USER_IDS 配置管理员</p>
  </div>

  <script>
    const API_BASE = '';
    let authMode = 'login';
    let submitting = false;

    function switchAuth(mode) {
      authMode = mode;
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-reg').classList.toggle('active', mode === 'register');
      document.getElementById('submit-btn').textContent = mode === 'login' ? '立即登录' : '注册并进入';
    }

    async function submitAuth() {
      if (submitting) return;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { alert('请填写用户名和密码'); return; }

      const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
      submitting = true;

      try {
        const res = await fetch(API_BASE + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('token', data.token);
          window.location.href = '/index.html';
        } else {
          alert(data.error || '操作失败');
        }
      } catch (error) {
        alert('网络异常，请稍后重试');
      } finally {
        submitting = false;
      }
    }

    document.getElementById('password').addEventListener('keydown', event => {
      if (event.key === 'Enter') submitAuth();
    });
  </script>
</body>
</html>
